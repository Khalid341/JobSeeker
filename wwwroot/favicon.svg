<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="favGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0e7490;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0c4a6e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="favAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5eead4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="50" cy="50" r="48" fill="url(#favGradient)"/>

  <!-- Two interlocking links -->
  <g transform="translate(50, 50)" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round">
    <path d="M -22 -5 C -30 -5 -32 5 -26 11 C -20 17 -10 12 -8 6 L -4 2"/>
    <path d="M 22 5 C 30 5 32 -5 26 -11 C 20 -17 10 -12 8 -6 L 4 -2"/>
  </g>

  <!-- Center -->
  <circle cx="50" cy="50" r="5" fill="url(#favAccent)"/>
  <circle cx="50" cy="50" r="2.5" fill="#ffffff"/>
</svg>
