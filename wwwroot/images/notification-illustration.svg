<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fca311;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e08c0a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="200" cy="200" r="180" fill="#f7fafc" opacity="0.5"/>
  
  <!-- Bell -->
  <g transform="translate(120, 100)">
    <!-- Bell body -->
    <path d="M 80 50 Q 80 20 80 20 Q 80 0 100 0 Q 120 0 120 20 L 120 50 Q 160 70 160 120 L 160 160 L 0 160 L 0 120 Q 0 70 40 50 Z" 
          fill="url(#bellGrad)" stroke="#e08c0a" stroke-width="3"/>
    <!-- Bell bottom -->
    <rect x="-10" y="160" width="180" height="20" rx="10" fill="url(#bellGrad)"/>
    <!-- Bell clapper -->
    <circle cx="80" cy="195" r="15" fill="#14213d"/>
    <!-- Sound waves -->
    <path d="M 170 100 Q 190 100 190 120" stroke="#fca311" stroke-width="4" fill="none" opacity="0.6"/>
    <path d="M 180 90 Q 210 90 210 120" stroke="#fca311" stroke-width="4" fill="none" opacity="0.4"/>
    <path d="M -10 100 Q -30 100 -30 120" stroke="#fca311" stroke-width="4" fill="none" opacity="0.6"/>
    <path d="M -20 90 Q -50 90 -50 120" stroke="#fca311" stroke-width="4" fill="none" opacity="0.4"/>
  </g>
  
  <!-- Notification badge -->
  <circle cx="280" cy="120" r="25" fill="#f56565"/>
  <text x="280" y="130" font-family="Arial" font-size="24" font-weight="bold" fill="white" text-anchor="middle">0</text>
</svg>
