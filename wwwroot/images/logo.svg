<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="linkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0e7490;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0c4a6e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentLink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#linkGradient)" filter="url(#softShadow)"/>

  <!-- Link/connection icon in white -->
  <g transform="translate(100, 100)" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left chain link -->
    <path d="M -45 -10 C -60 -10 -65 5 -55 15 C -45 25 -30 20 -25 10 L -15 0"
          stroke-width="7"/>
    <!-- Right chain link -->
    <path d="M 45 10 C 60 10 65 -5 55 -15 C 45 -25 30 -20 25 -10 L 15 0"
          stroke-width="7"/>
    <!-- Connection highlight -->
    <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="none"/>
  </g>

  <!-- Two abstract people silhouette -->
  <g transform="translate(100, 100)" filter="url(#softShadow)">
    <!-- Left person -->
    <g transform="translate(-35, 5)">
      <circle cx="0" cy="-28" r="11" fill="#ffffff" opacity="0.95"/>
      <path d="M 0 -17 Q -14 -8 -16 6 Q -18 20 -8 32" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
    <!-- Right person -->
    <g transform="translate(35, 5)">
      <circle cx="0" cy="-28" r="11" fill="#ffffff" opacity="0.95"/>
      <path d="M 0 -17 Q 14 -8 16 6 Q 18 20 8 32" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Subtle shine -->
  <circle cx="70" cy="60" r="12" fill="#ffffff" opacity="0.1"/>
</svg>
