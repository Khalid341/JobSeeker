<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="emptyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cbd5e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="200" r="180" fill="url(#emptyGrad)" opacity="0.3"/>
  
  <!-- Magnifying glass -->
  <g transform="translate(150, 120)">
    <circle cx="50" cy="50" r="45" fill="none" stroke="#718096" stroke-width="8"/>
    <line x1="85" y1="85" x2="120" y2="120" stroke="#718096" stroke-width="12" stroke-linecap="round"/>
    <!-- Question mark inside -->
    <text x="50" y="65" font-family="Arial" font-size="40" font-weight="bold" fill="#718096" text-anchor="middle">?</text>
  </g>
  
  <!-- Decorative dots -->
  <circle cx="80" cy="80" r="8" fill="#fca311" opacity="0.6"/>
  <circle cx="320" cy="100" r="6" fill="#14213d" opacity="0.5"/>
  <circle cx="100" cy="320" r="10" fill="#fca311" opacity="0.4"/>
  <circle cx="300" cy="300" r="7" fill="#14213d" opacity="0.6"/>
</svg>
