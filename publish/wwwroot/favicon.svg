<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0e7490;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0c4a6e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="favAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Two abstract people connected -->
  <g transform="translate(16, 16)">
    <!-- Left person -->
    <g transform="translate(-5, 0)">
      <circle cx="0" cy="-6" r="2.2" fill="url(#favGrad)"/>
      <path d="M 0 -4 Q -1.5 -2.5 -2 -1 Q -2.5 0.5 -2 2" 
            stroke="url(#favGrad)" 
            stroke-width="1" 
            fill="none" 
            stroke-linecap="round"/>
      <path d="M -0.5 -2 Q 1.5 -1 3 0" 
            stroke="url(#favAccent)" 
            stroke-width="0.8" 
            fill="none" 
            stroke-linecap="round"/>
    </g>
    
    <!-- Right person -->
    <g transform="translate(5, 0)">
      <circle cx="0" cy="-6" r="2.2" fill="url(#favGrad)"/>
      <path d="M 0 -4 Q 1.5 -2.5 2 -1 Q 2.5 0.5 2 2" 
            stroke="url(#favGrad)" 
            stroke-width="1" 
            fill="none" 
            stroke-linecap="round"/>
      <path d="M 0.5 -2 Q -1.5 -1 -3 0" 
            stroke="url(#favAccent)" 
            stroke-width="0.8" 
            fill="none" 
            stroke-linecap="round"/>
    </g>
    
    <!-- Connection point -->
    <circle cx="0" cy="0" r="1.5" fill="url(#favAccent)"/>
    <circle cx="0" cy="0" r="0.6" fill="#ffffff"/>
  </g>
</svg>
